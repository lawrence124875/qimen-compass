name: Build Android

on:
  push:
    branches: [main]
    # 只改文件的 commit 不建置（HANDOFF 更新不產生 Release）
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force_lang:
        description: '測試用：強制介面語言（例如 en），留空為正式版'
        required: false
        default: ''

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      # 11 語翻譯檢查（tools/l10n/README.md）：術語表完整、ARB 參數一致、術語鍵＝術語表、terms_data.dart 是最新。
      # 未開放語言缺鍵只列 warning，不讓 CI 失敗。
      - name: 翻譯檢查
        run: python3 tools/l10n/l10n.py check

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 比照謙卦：stable 3.50.0 的 release lint 在 JDK 17 崩潰，固定在 3.47.9
          flutter-version: '3.47.9'
          cache: true

      # 本 repo 只放跨平台程式（lib/、pubspec.yaml）；android/ 在這裡自動產生。
      - name: 產生 Android 平台資料夾
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=qimen_compass --org com.lclab .
          fi
          rm -f test/widget_test.dart

      # 還沒設定上傳金鑰時，用 qimen-content 的固定除錯金鑰（signing/），每次建置簽章相同，測試版可覆蓋安裝、保留紀錄
      - name: 取得固定測試金鑰
        if: ${{ env.HAS_UPLOAD_KEY != 'true' }}
        uses: actions/checkout@v5
        with:
          repository: lawrence124875/qimen-content
          token: ${{ secrets.BUILDS_REPO_TOKEN }}
          path: _signing
          sparse-checkout: signing

      - name: 安裝固定測試金鑰
        if: ${{ env.HAS_UPLOAD_KEY != 'true' }}
        run: |
          if [ -f _signing/signing/debug.keystore ]; then
            mkdir -p ~/.android && cp _signing/signing/debug.keystore ~/.android/debug.keystore
            echo "::notice title=簽署::使用固定測試金鑰，可覆蓋安裝"
          else
            echo "::warning::找不到 qimen-content signing/debug.keystore，本次簽章會不同，需先移除舊版"
          fi
          rm -rf _signing

      - name: 套用 App 設定（名稱、簽署）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash scripts/patch_android.sh

      # Firebase：與謙卦共用專案。Secret GOOGLE_SERVICES_JSON_BASE64 需含 com.lclab.qimen；沒設定就不含 Firebase。
      - name: 套用 Firebase 設定
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash scripts/patch_firebase.sh

      # 廣告與訂閱：AdMob App ID（沒設定用 Google 測試 ID，少了會閃退）、ProGuard
      - name: 套用廣告與訂閱設定
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: bash scripts/patch_ads.sh

      # Wear OS 手錶羅盤：android_extra/wear → android/wear（:wear 模組）
      - name: 加入手錶模組
        run: bash scripts/patch_wear.sh

      # 判讀文句、規則 JSON、課程等 App 內容放在私人 repo qimen-content 的 app/，建置時複製到 assets/content/（不進公開 repo）
      - name: 取得 App 內容（qimen-content/app）
        uses: actions/checkout@v5
        with:
          repository: lawrence124875/qimen-content
          token: ${{ secrets.BUILDS_REPO_TOKEN }}
          path: _content
          sparse-checkout: app

      - name: 複製 App 內容
        run: |
          mkdir -p assets/content
          if [ -d _content/app ]; then cp -r _content/app/. assets/content/; fi
          rm -rf _content
          echo "::notice title=App 內容::$(find assets/content -name '*.json' | wc -l) 個 JSON"

      - name: 產生字型子集
        run: |
          pip install --quiet fonttools
          python3 scripts/build_fonts.py || { echo "::error::字型子集產生失敗（scripts/build_fonts.py）"; exit 1; }

      - name: 安裝套件
        run: flutter pub get

# 錯誤轉成 annotation，Claude 可用 check-runs API 讀取摘要（容器連不到日誌下載網址）。
      - name: 靜態檢查
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.log 2>&1
          status=$?
          cat /tmp/analyze.log
          if [ $status -ne 0 ]; then
            grep -E "error •|error -" /tmp/analyze.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: 單元測試（含 golden）
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          summary=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E 'All tests|Some tests' | tail -1)
          golden=$(ls test/golden/cases/*.json 2>/dev/null | wc -l)
          echo "::notice title=測試摘要::${summary:-（無摘要）}；golden 測試盤 ${golden} 組"
          if [ $status -ne 0 ]; then
            grep -E "\[E\]|Expected|Actual|Error|reason" /tmp/test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: 建置 APK（release）
        env:
          FORCE_LANG: ${{ inputs.force_lang }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} ${FORCE_LANG:+--dart-define=FORCE_LANG=$FORCE_LANG} --dart-define=MAPS_ENABLED=${{ secrets.MAPS_API_KEY != '' }} --dart-define=REVENUECAT_API_KEY="$REVENUECAT_API_KEY" --dart-define=ADMOB_BANNER_AD_UNIT_ID="$ADMOB_BANNER_AD_UNIT_ID" --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID="$ADMOB_INTERSTITIAL_AD_UNIT_ID" --dart-define=ADMOB_REWARDED_AD_UNIT_ID="$ADMOB_REWARDED_AD_UNIT_ID" > /tmp/build.log 2>&1
          status=$?
          tail -n 40 /tmp/build.log
          if [ $status -ne 0 ]; then
            grep -E "\.dart:[0-9]+|Error:|error:|FAILURE|What went wrong" /tmp/build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      # 上架用 AAB；強制介面語言的測試版不建。
      - name: 建置 AAB（release）
        if: ${{ inputs.force_lang == '' }}
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          set +e
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=MAPS_ENABLED=${{ secrets.MAPS_API_KEY != '' }} --dart-define=REVENUECAT_API_KEY="$REVENUECAT_API_KEY" --dart-define=ADMOB_BANNER_AD_UNIT_ID="$ADMOB_BANNER_AD_UNIT_ID" --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID="$ADMOB_INTERSTITIAL_AD_UNIT_ID" --dart-define=ADMOB_REWARDED_AD_UNIT_ID="$ADMOB_REWARDED_AD_UNIT_ID" > /tmp/bundle.log 2>&1
          status=$?
          tail -n 20 /tmp/bundle.log
          if [ $status -ne 0 ]; then
            grep -E "\.dart:[0-9]+|Error:|error:|FAILURE|What went wrong" /tmp/bundle.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      # 私人解鎖版 APK（FORCE_PREMIUM，只給 Lawrence 自用）：獨立套件 com.lclab.qimen.personal，可與免費版同時安裝。
      # 會改 android/ 的套件名與桌面名稱，所以放在免費版 APK、AAB 之後。
      - name: 建置私人解鎖版 APK
        env:
          FORCE_LANG: ${{ inputs.force_lang }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          set +e
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/free.apk
          bash scripts/make_personal.sh || exit 1
          flutter build apk --release --build-number=${{ github.run_number }} ${FORCE_LANG:+--dart-define=FORCE_LANG=$FORCE_LANG} --dart-define=FORCE_PREMIUM=true --dart-define=MAPS_ENABLED=${{ secrets.MAPS_API_KEY != '' }} --dart-define=REVENUECAT_API_KEY="$REVENUECAT_API_KEY" > /tmp/build_personal.log 2>&1
          status=$?
          tail -n 20 /tmp/build_personal.log
          if [ $status -ne 0 ]; then
            grep -E "\.dart:[0-9]+|Error:|error:|FAILURE|What went wrong" /tmp/build_personal.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/personal.apk
          cp /tmp/free.apk build/app/outputs/flutter-apk/app-release.apk

      # 手錶羅盤：免費版（com.lclab.qimen，配上架版／免費版 APK）與私人版（配私人版 APK）各一個 APK，上架用 AAB 一個。
      # versionCode＝1000000＋run（與手機版不重複）。失敗不擋手機版發佈。
      - name: 建置 Wear OS 手錶羅盤
        id: wear
        continue-on-error: true
        run: |
          set +e
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          code=$((1000000 + ${{ github.run_number }}))
          cd android
          args="-PqmVersionCode=$code -PqmVersionName=$ver --no-daemon --console=plain"
          build() {
            ./gradlew "$@" $args > /tmp/wear.log 2>&1 || {
              tail -n 60 /tmp/wear.log
              grep -E "^e: |error:|FAILURE|What went wrong|Could not" /tmp/wear.log | head -30 | while IFS= read -r line; do echo "::error title=手錶::$line"; done
              exit 1
            }
          }
          build :wear:assembleRelease -PqmAppId=com.lclab.qimen.personal
          mkdir -p /tmp/wear
          cp "$(find .. -path '*wear*' -name 'wear-release.apk' | head -1)" /tmp/wear/personal.apk
          build :wear:assembleRelease :wear:bundleRelease -PqmAppId=com.lclab.qimen
          cp "$(find .. -path '*wear*' -name 'wear-release.apk' | head -1)" /tmp/wear/free.apk
          cp "$(find .. -path '*wear*' -name 'wear-release.aab' | head -1)" /tmp/wear/play.aab
          ls -la /tmp/wear
          echo "::notice title=手錶::APK $(( $(stat -c %s /tmp/wear/free.apk) / 1024 )) KB"

      - name: 大小摘要
        if: ${{ always() }}
        run: |
          aab=$(( $(stat -c %s build/app/outputs/bundle/release/app-release.aab 2>/dev/null || echo 0) / 1024 ))
          apk=$(( $(stat -c %s build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || echo 0) / 1024 ))
          echo "::notice title=大小摘要::AAB=${aab} KB APK=${apk} KB"

      # ⚠️ 永久原則：APK／AAB 不可用 upload-artifact 放在公開 repo，一律發佈到私人 repo qimen-content 的 Release。
      - name: 發佈到私人 repo 的 Release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          FORCE_LANG: ${{ inputs.force_lang }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret BUILDS_REPO_TOKEN 沒有設定"; exit 1; fi
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          n=${{ github.run_number }}
          ui="${FORCE_LANG:+_ui-$FORCE_LANG}"
          # 三個檔：免費版 APK（同上架版，有鎖）、私人解鎖版 APK（自用，全開）、上架用 AAB（免費版，訂閱解鎖）
          free="qimen_${ver}_run${n}_free${ui}.apk"
          personal="qimen_${ver}_run${n}_personal${ui}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$free"
          cp /tmp/personal.apk "$personal"
          files=("$free" "$personal")
          wear_free="qimen_${ver}_run${n}_wear.apk"
          wear_personal="qimen_${ver}_run${n}_wear_personal.apk"
          wear_aab="qimen_${ver}_run${n}_wear_play.aab"
          if [ -f /tmp/wear/free.apk ]; then
            cp /tmp/wear/free.apk "$wear_free"; cp /tmp/wear/personal.apk "$wear_personal"; files+=("$wear_free" "$wear_personal")
          fi
          aab=build/app/outputs/bundle/release/app-release.aab
          if [ -z "${FORCE_LANG}" ] && [ -f "$aab" ]; then
            cp "$aab" "qimen_${ver}_run${n}_play.aab"
            files+=("qimen_${ver}_run${n}_play.aab")
          fi
          if [ -z "${FORCE_LANG}" ] && [ -f /tmp/wear/play.aab ]; then
            cp /tmp/wear/play.aab "$wear_aab"; files+=("$wear_aab")
          fi
          # 版本資訊（Play「版本資訊」欄可直接貼）放在 AAB 上方；內容維護在 store/release_notes.txt
          {
            echo "## 檔案"
            echo "- \`${free}\`：免費版 APK（與上架版相同，進階功能需訂閱）"
            echo "- \`${personal}\`：私人解鎖版 APK（自用，全部功能開放，勿外流）"
            [ -z "${FORCE_LANG}" ] && echo "- \`qimen_${ver}_run${n}_play.aab\`：上傳 Play 用 AAB（免費版，訂閱後解鎖）"
            if [ -f "$wear_free" ]; then
              echo "- \`${wear_free}\`：手錶羅盤（配免費版 APK／上架版）"
              echo "- \`${wear_personal}\`：手錶羅盤私人版（配私人解鎖版 APK）"
              [ -z "${FORCE_LANG}" ] && echo "- \`${wear_aab}\`：手錶羅盤上架用 AAB（Play Console「Wear OS」版本類型）"
            else
              echo "- （本次手錶羅盤建置失敗，見 Actions）"
            fi
            echo
            echo "私人解鎖版套件名稱為 com.lclab.qimen.personal，可與免費版同時安裝（資料各自獨立）。手錶 APK 需用 adb 經無線偵錯安裝。"
            echo
            echo "## 版本資訊（貼到 Play）"; echo; echo '```'; cat store/release_notes.txt; echo '```'; echo
            echo "commit ${{ github.sha }}；簽署：${SIGNING}"
          } > notes.md
          gh release create "qimen-android-run${n}" "${files[@]}" \
            --repo lawrence124875/qimen-content \
            --title "奇門羅盤 ${ver}（run ${n}）${FORCE_LANG:+［測試：介面 $FORCE_LANG］}" \
            --notes-file notes.md
          echo "::notice title=Release::qimen-content qimen-android-run${n}"

      # 依 run 編號排序（不用 createdAt，避免內容 repo 沒變時誤刪最新的；謙卦 run 6 的教訓）。
      - name: 只保留最近 5 個建置 Release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo lawrence124875/qimen-content --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("qimen-android-run"))] | sort_by(.tagName | ltrimstr("qimen-android-run") | tonumber) | reverse | .[5:] | .[].tagName' |
          while IFS= read -r tag; do
            gh release delete "$tag" --repo lawrence124875/qimen-content --yes --cleanup-tag
          done
