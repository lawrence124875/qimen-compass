name: Check (branches)

# 分支上的快速檢查（不建置、不發 Release）：靜態檢查＋單元測試（含 golden）。
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 11 語翻譯檢查（tools/l10n/README.md）：術語表完整、ARB 參數一致、術語鍵＝術語表、terms_data.dart 是最新。
      # 未開放語言缺鍵只列 warning，不讓 CI 失敗。
      - name: 翻譯檢查
        run: python3 tools/l10n/l10n.py check

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 比照謙卦：stable 3.50.0 的 release lint 在 JDK 17 崩潰，固定在 3.47.9
          flutter-version: '3.47.9'
          cache: true

      # 判讀文句、規則 JSON、課程等 App 內容放在私人 repo qimen-content 的 app/，建置時複製到 assets/content/（不進公開 repo）
      - name: 取得 App 內容（qimen-content/app）
        uses: actions/checkout@v5
        with:
          repository: lawrence124875/qimen-content
          token: ${{ secrets.BUILDS_REPO_TOKEN }}
          path: _content
          sparse-checkout: app

      # qimen-content 有同名分支時改用它，程式與內容可以一起改、一起測
      - name: 同名內容分支（若有）
        run: |
          cd _content
          if git fetch -q --depth 1 origin "$GITHUB_REF_NAME" 2>/dev/null; then
            git checkout -q FETCH_HEAD
            echo "::notice title=App 內容::使用 qimen-content 分支 $GITHUB_REF_NAME"
          fi

      - name: 複製 App 內容
        run: |
          mkdir -p assets/content
          if [ -d _content/app ]; then cp -r _content/app/. assets/content/; fi
          rm -rf _content
          echo "::notice title=App 內容::$(find assets/content -name '*.json' | wc -l) 個 JSON"

      - name: 產生字型子集
        run: |
          pip install --quiet fonttools
          python3 scripts/build_fonts.py || { echo "::error::字型子集產生失敗（scripts/build_fonts.py）"; exit 1; }

      - name: 安裝套件
        run: flutter pub get

# 錯誤轉成 annotation，Claude 可用 check-runs API 讀取摘要（容器連不到日誌下載網址）。
      - name: 靜態檢查
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.log 2>&1
          status=$?
          cat /tmp/analyze.log
          if [ $status -ne 0 ]; then
            grep -E "error •|error -" /tmp/analyze.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: 單元測試（含 golden）
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          summary=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E 'All tests|Some tests' | tail -1)
          golden=$(ls test/golden/cases/*.json 2>/dev/null | wc -l)
          echo "::notice title=測試摘要::${summary:-（無摘要）}；golden 測試盤 ${golden} 組"
          if [ $status -ne 0 ]; then
            grep -E "\[E\]|Expected|Actual|Error|reason" /tmp/test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

  # 原生程式（MainActivity 手錶同步、:wear 手錶羅盤）只在建置時才會編譯，分支上先用 debug 建置驗證。
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: 產生 Android 平台資料夾並套用設定
        run: |
          flutter create --platforms=android --project-name=qimen_compass --org com.lclab .
          rm -f test/widget_test.dart
          bash scripts/patch_android.sh
          bash scripts/patch_wear.sh

      - name: 產生字型子集
        run: |
          pip install --quiet fonttools
          python3 scripts/build_fonts.py

      - name: 建置 debug APK（手機＋手錶）
        run: |
          set +e
          flutter pub get > /dev/null
          flutter build apk --debug --target-platform android-arm64 > /tmp/build.log 2>&1
          status=$?
          if [ $status -eq 0 ]; then
            (cd android && ./gradlew :wear:assembleDebug --no-daemon --console=plain) > /tmp/wear.log 2>&1
            status=$?
            tail -n 40 /tmp/wear.log
            [ $status -eq 0 ] || grep -E "^e: |error:|FAILURE|What went wrong|Could not" /tmp/wear.log | head -30 | while IFS= read -r line; do echo "::error title=手錶::$line"; done
          else
            tail -n 60 /tmp/build.log
            grep -E "^e: |\.dart:[0-9]+|\.kt:|error:|FAILURE|What went wrong|Could not" /tmp/build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status
