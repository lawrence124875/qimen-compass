name: qimen_compass
description: "奇門羅盤 Qimen Compass（LC Lab）"
publish_to: 'none'
version: 1.8.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# 原則：只用同時支援 Android 與 iOS 的套件（比照謙卦 iching-cards）。
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # 介面翻譯（ARB，比照謙卦）
    sdk: flutter
  intl: any # 版本由 flutter_localizations 決定
  lunar: ^1.7.8 # 節氣與干支（6tail，純 Dart；包在 lib/engine/calendar_service.dart）
  flutter_compass: # 羅盤方位角（lib/compass/）；本地修改版，見 packages/flutter_compass
    path: packages/flutter_compass
  sensors_plus: ^7.1.1 # 磁力計（干擾偵測）、加速度計（平放提示）
  geomag: ^0.3.0 # WMM 2025 磁偏角（真北）
  geolocator: ^14.0.0 # 真北取概略位置；地圖八門取目前位置
  # 地圖八門、目的地吉凶（HANDOFF §12 P2）：原生地圖免費，只需 Maps API key；地址查詢用手機內建 geocoder，不用付費 Places
  google_maps_flutter: ^2.10.0
  geocoding: ^4.0.0
  home_widget: ^0.7.0 # 桌面小工具（HANDOFF §12 P7；原生端在 android_extra/）
  # 出行訣與吉時推播（HANDOFF §5）
  flutter_local_notifications: ^19.4.0 # 吉時推播（非精確排程，不用精確鬧鐘權限）
  timezone: ^0.10.0 # zonedSchedule 需要（一律以 UTC 排程）
  shared_preferences: ^2.3.0
  pedometer: ^4.1.1 # 走路／跑步計步
  permission_handler: ^12.0.0 # Android 計步權限（ACTIVITY_RECOGNITION）；通知被拒時 openAppSettings()
  # 宅盤九宮（HANDOFF §6）
  image_picker: ^1.1.2 # 拍平面圖／從相簿選（Android 用系統相片挑選器，不需儲存權限）
  add_2_calendar: ^3.0.1 # 擇時擇日：加入手機行事曆（Android 用 intent，不需行事曆權限）
  # 比照謙卦的共通功能（紀錄、分享、意見回饋、更新提示、免費版／廣告／訂閱）
  path_provider: ^2.1.4 # 紀錄、額度、設定檔存檔位置
  url_launcher: ^6.3.1 # 隱私權政策、LC Lab 其他 App、管理訂閱
  share_plus: ^13.3.1 # 分享盤面卡片、推薦給朋友、紀錄備份匯出
  file_picker: ^13.1.0 # 紀錄從備份還原
  package_info_plus: ^10.2.2 # 意見回饋附上 App 版本
  in_app_update: ">=4.2.5 <6.0.0" # Google Play 更新提示（只有 Android）
  firebase_core: ^3.6.0 # 與謙卦共用 Firebase 專案（參數、事件、集合一律 qm_ 開頭）
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4 # 意見回饋（集合 qm_feedback）
  firebase_remote_config: ^5.1.3 # 遠端開關、免費版額度（qm_ 開頭）
  google_mobile_ads: ^9.0.0
  purchases_flutter: ">=10.0.0 <10.8.0" # RevenueCat 訂閱

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # 由 lib/l10n/*.arb 產生 AppLocalizations（l10n.yaml）

  # App 內容（私人 repo qimen-content/app/，CI 建置時複製進來；各子資料夾放 .gitkeep）
  assets:
    - assets/other_apps/ # LC Lab 其他 App 圖示（設定頁）
    - assets/content/divination/
    - assets/content/divination/text/ # Flutter 資料夾不含子資料夾，子資料夾要另外列
    - assets/content/course/
    - assets/content/meaning/ # 盤面點擊解說

  # 字型子集由 scripts/build_fonts.py 產生（CI 自動執行；本機開發先跑一次）
  fonts:
    - family: QmSans
      fonts:
        - asset: assets/fonts/QmSans-Regular.otf
        - asset: assets/fonts/QmSans-Bold.otf
          weight: 700
    - family: QmSerif
      fonts:
        - asset: assets/fonts/QmSerif-Regular.otf
        - asset: assets/fonts/QmSerif-Bold.otf
          weight: 700
    - family: QmFbSC
      fonts:
        - asset: assets/fonts/QmFbSC-Regular.otf
    - family: QmFbJP
      fonts:
        - asset: assets/fonts/QmFbJP-Regular.otf
    - family: QmFbKR
      fonts:
        - asset: assets/fonts/QmFbKR-Regular.otf
    - family: QmFbTH
      fonts:
        - asset: assets/fonts/QmFbTH-Regular.ttf
    - family: QmFbAR
      fonts:
        - asset: assets/fonts/QmFbAR-Regular.ttf
