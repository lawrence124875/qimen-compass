name: qm_places
description: 奇門羅盤 iOS 地點搜尋（Apple 地圖 MKLocalSearch，免費、免金鑰）。只有 iOS 實作，頻道 qm/places。
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: QmPlacesPlugin
